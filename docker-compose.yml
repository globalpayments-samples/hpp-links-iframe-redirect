services:
  nodejs:
    build:
      context: ./nodejs
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - PORT=8000
      - GP_APP_ID=${GP_APP_ID}
      - GP_APP_KEY=${GP_APP_KEY}
      - GP_MERCHANT_ID=${GP_MERCHANT_ID}
      - GP_ACCOUNT_NAME=${GP_ACCOUNT_NAME}
    networks:
      - payments
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/webhook-events"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  python:
    build:
      context: ./python
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    environment:
      - PORT=8000
      - GP_APP_ID=${GP_APP_ID}
      - GP_APP_KEY=${GP_APP_KEY}
      - GP_MERCHANT_ID=${GP_MERCHANT_ID}
      - GP_ACCOUNT_NAME=${GP_ACCOUNT_NAME}
    networks:
      - payments
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/webhook-events"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    ports:
      - "8003:8000"
    environment:
      - GP_APP_ID=${GP_APP_ID}
      - GP_APP_KEY=${GP_APP_KEY}
      - GP_MERCHANT_ID=${GP_MERCHANT_ID}
      - GP_ACCOUNT_NAME=${GP_ACCOUNT_NAME}
    networks:
      - payments
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/webhook-events"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  java:
    build:
      context: ./java
      dockerfile: Dockerfile
    ports:
      - "8004:8000"
    environment:
      - GP_APP_ID=${GP_APP_ID}
      - GP_APP_KEY=${GP_APP_KEY}
      - GP_MERCHANT_ID=${GP_MERCHANT_ID}
      - GP_ACCOUNT_NAME=${GP_ACCOUNT_NAME}
    networks:
      - payments
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/webhook-events"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  dotnet:
    build:
      context: ./dotnet
      dockerfile: Dockerfile
    ports:
      - "8006:8000"
    environment:
      - ASPNETCORE_URLS=http://+:8000
      - GP_APP_ID=${GP_APP_ID}
      - GP_APP_KEY=${GP_APP_KEY}
      - GP_MERCHANT_ID=${GP_MERCHANT_ID}
      - GP_ACCOUNT_NAME=${GP_ACCOUNT_NAME}
    networks:
      - payments
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/webhook-events"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Test runner container
  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    depends_on:
      nodejs:
        condition: service_healthy
      python:
        condition: service_healthy
      php:
        condition: service_healthy
      java:
        condition: service_healthy
      dotnet:
        condition: service_healthy
    environment:
      - CI=true
      # Forwarded by `docker-run.sh test:single <impl>` to run one framework.
      - IMPLEMENTATION_FILTER=${IMPLEMENTATION_FILTER:-}
    networks:
      - payments
    volumes:
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report
    profiles:
      - testing

networks:
  payments:
    driver: bridge
